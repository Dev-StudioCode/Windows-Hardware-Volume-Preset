; ==========================================================
; Audio Hardware Volume Preset - Configuration
; ==========================================================
; Changes take effect after saving and clicking "Reload Settings"
; in the system tray menu, or after restarting the application.

[Settings]
; Master fallback volume percentage (0-100) applied when an audio
; device connects without a specific matching rule below.
DefaultVolume = 30

; Maximum volume ceiling (0-100). Presets will never exceed this cap.
MaxVolumeLimit = 100

; 1 = Apply DefaultVolume to unlisted devices; 0 = Leave them untouched.
ApplyToAllDevices = 1

; 1 = Automatically unmute device on connect; 0 = Leave mute status.
AutoUnmute = 1

; 1 = Apply preset to current default playback device at app start.
ApplyOnStartup = 1

[Rules]
; Format: Keyword or Device Name = Volume %
; The first matching rule wins. Place more specific rules first.
AirPods = 30
Sony = 25
Speakers = 50
DAC = 40
